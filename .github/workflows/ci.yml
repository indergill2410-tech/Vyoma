name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      # next build runs `prisma generate`, which only needs the var to be set
      # (it does not connect). DB-backed routes are wrapped in try/catch so the
      # build prerenders without a real database.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
