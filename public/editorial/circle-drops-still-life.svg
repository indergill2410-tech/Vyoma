<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 900" role="img" aria-label="Vyoma Circle founder drop scene with real product photography">
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#11162f"/>
      <stop offset="0.52" stop-color="#4f557b"/>
      <stop offset="1" stop-color="#efd5b8"/>
    </linearGradient>
    <radialGradient id="dawn" cx="86%" cy="18%" r="54%">
      <stop offset="0" stop-color="#fff1cf" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#fff1cf" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#080c1c" flood-opacity="0.32"/>
    </filter>
    <clipPath id="primary"><rect x="410" y="108" width="575" height="680" rx="34"/></clipPath>
    <clipPath id="secondary"><rect x="112" y="132" width="340" height="320" rx="30"/></clipPath>
    <clipPath id="accent"><rect x="150" y="500" width="320" height="280" rx="30"/></clipPath>
  </defs>
  <rect width="1100" height="900" fill="url(#sky)"/>
  <rect width="1100" height="900" fill="url(#dawn)"/>
  <circle cx="878" cy="154" r="92" fill="#f7ead1" opacity="0.32"/>
  <path d="M92 758 C310 682 516 666 742 716 C860 742 956 780 1030 820" fill="none" stroke="#efd5b8" stroke-width="30" opacity="0.24"/>
  <g filter="url(#shadow)" clip-path="url(#primary)">
    <image href="/products/vyoma-the-set/model.png" xlink:href="/products/vyoma-the-set/model.png" x="360" y="76" width="700" height="744" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g filter="url(#shadow)" clip-path="url(#secondary)">
    <image href="/products/vyoma-mat-bag/model.png" xlink:href="/products/vyoma-mat-bag/model.png" x="88" y="96" width="390" height="398" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g filter="url(#shadow)" clip-path="url(#accent)">
    <image href="/products/vyoma-pure-brief-women/model.png" xlink:href="/products/vyoma-pure-brief-women/model.png" x="120" y="468" width="370" height="340" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="410" y="108" width="575" height="680" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="2"/>
  <rect x="0" y="0" width="1100" height="900" fill="#11162f" opacity="0.06"/>
</svg>
